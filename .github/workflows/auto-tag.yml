name: auto-tag

#runs on every push to master that touches cbzLab.csproj (a version bump, or a
#dependency bump that leaves <Version> unchanged) and tags v<version> if that tag
#doesn't already exist - release.yml is tag-triggered by design (see its own top
#comment), so this closes the loop that used to rely on remembering to run
#`git tag vX.Y.Z && git push origin vX.Y.Z` by hand after every version bump.
#idempotent: a push that doesn't change <Version> (e.g. a dependency-only bump)
#just finds the tag already exists and does nothing.
on:
  push:
    branches: [master]
    paths:
      - "cbzLab/cbzLab.csproj"

permissions:
  contents: write
  actions: write

jobs:
  auto-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Read version from cbzLab.csproj
        id: version
        run: |
          VERSION=$(grep -oP '(?<=<Version>)[^<]+' cbzLab/cbzLab.csproj)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      #checks the remote, not just the local (shallow, depth-1) checkout - a tag
      #pushed by an earlier run of this same workflow wouldn't exist in this fresh
      #checkout otherwise, and would get recreated/re-pushed every time
      - name: Tag and push, if this version isn't tagged yet
        id: tag
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if git ls-remote --tags origin | grep -q "refs/tags/$TAG$"; then
            echo "$TAG already exists - nothing to do."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "cbzLab $TAG"
          git push origin "$TAG"
          echo "created=true" >> "$GITHUB_OUTPUT"

      #a tag pushed with the default GITHUB_TOKEN doesn't trigger other workflows
      #(GitHub's built-in recursion guard) - confirmed the hard way, the first real
      #run of this workflow tagged v2.0.2 successfully but release.yml never fired.
      #workflow_dispatch is explicitly exempt from that guard, so dispatch it directly
      #instead of relying on release.yml's own tag-push trigger to fire on its own.
      - name: Trigger release.yml for the new tag
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run release.yml --ref "${{ steps.version.outputs.tag }}"
