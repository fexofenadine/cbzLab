name: build

#runs on every push and every pull request, regardless of branch name, so it
#works out of the box whatever the repo's default branch is called
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      #the old x64/ARM64 Platform matrix only meant anything for the now-archived
      #WinUI project (Platform-based RID switching, now at cbzLab.winui3/). cbzLab.sln
      #now only holds cbzLab (plain AnyCPU, no Platform property) and its test project -
      #an OS matrix is the meaningful axis now that the app is actually cross-platform
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      #restore and build/test run as one command each, not split with --no-restore/
      #--no-build: a plain `dotnet restore` with no -c Release doesn't know to fetch
      #the RID-specific packages cbzLab/cbzLab.csproj's SelfContained (conditional
      #on Release) needs, and a later --no-restore build then fails looking for a
      #target project.assets.json never restored - bit every CI run for weeks
      - name: Build (Release)
        run: dotnet build cbzLab.sln -c Release

      - name: Test
        run: dotnet test cbzLab.Tests/cbzLab.Tests.csproj -c Release
