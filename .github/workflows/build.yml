name: build

#runs on every push and every pull request, regardless of branch name, so it
#works out of the box whatever the repo's default branch is called
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      #the old x64/ARM64 Platform matrix only meant anything for the now-archived
      #WinUI cbzLab.csproj (Platform-based RID switching). cbzLab.sln now only holds
      #cbzLab.Avalonia (plain AnyCPU, no Platform property) and its test project -
      #an OS matrix is the meaningful axis now that the app is actually cross-platform
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore cbzLab.sln

      - name: Build (Release)
        run: dotnet build cbzLab.sln -c Release --no-restore

      - name: Test
        run: dotnet test cbzLab.Avalonia.Tests/cbzLab.Avalonia.Tests.csproj -c Release --no-build
