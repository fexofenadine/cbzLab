name: release

#triggered by pushing a version tag (e.g. `git tag v2.0.1 && git push origin v2.0.1`),
#not by every push to a branch - deliberate: a release is a cut point you choose,
#not something that should fire on every commit. Bump cbzLab.Avalonia.csproj's
#<Version> and MainWindow.axaml.cs's DisplayVersion together first, commit, then tag.
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Derive version from tag (strips the leading "v")
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      #catches the tag and cbzLab.Avalonia.csproj's <Version> drifting apart - e.g.
      #tagging v2.1.0 while the csproj (and MainWindow.axaml.cs's DisplayVersion,
      #kept in sync with it by convention, not checked here) still says 2.0.0
      - name: Verify tag matches the project version
        run: |
          PROJECT_VERSION=$(grep -oP '(?<=<Version>)[^<]+' cbzLab.Avalonia/cbzLab.Avalonia.csproj)
          if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} implies version ${{ steps.version.outputs.version }}, but cbzLab.Avalonia.csproj's <Version> is $PROJECT_VERSION - bump the csproj (and MainWindow.axaml.cs's DisplayVersion) first."
            exit 1
          fi

      #fails the release rather than shipping a build that doesn't pass its own suite -
      #self-contained rather than relying on the separate build workflow, since a tag
      #push triggers both workflows independently with no ordering guarantee between
      #them. Each command restores for itself rather than splitting into a separate
      #restore + --no-restore/--no-build steps: a plain `dotnet restore` with no
      #-c Release doesn't know to fetch the RID-specific packages SelfContained
      #(conditional on Release) needs, and a later --no-restore build then fails.
      - name: Build and test
        run: |
          dotnet build cbzLab.sln -c Release
          dotnet test cbzLab.Avalonia.Tests/cbzLab.Avalonia.Tests.csproj -c Release

      #self-contained publish doesn't need the target OS - both run fine from this
      #ubuntu runner, and doing so here means the linux-x64 binary gets a real,
      #natively-set executable bit rather than one that has to be forced afterward
      - name: Publish win-x64
        run: >
          dotnet publish cbzLab.Avalonia/cbzLab.Avalonia.csproj
          -c Release -r win-x64 --self-contained true
          -o publish/win-x64

      - name: Publish linux-x64
        run: >
          dotnet publish cbzLab.Avalonia/cbzLab.Avalonia.csproj
          -c Release -r linux-x64 --self-contained true
          -o publish/linux-x64

      #both mac architectures are worth shipping: osx-x64 for older Intel Macs,
      #osx-arm64 for current Apple Silicon ones - neither is a substitute for the
      #other. Unsigned/unnotarized like the other two builds, so Gatekeeper will
      #warn on first launch; no Apple Developer account is set up to fix that yet.
      - name: Publish osx-x64
        run: >
          dotnet publish cbzLab.Avalonia/cbzLab.Avalonia.csproj
          -c Release -r osx-x64 --self-contained true
          -o publish/osx-x64

      - name: Publish osx-arm64
        run: >
          dotnet publish cbzLab.Avalonia/cbzLab.Avalonia.csproj
          -c Release -r osx-arm64 --self-contained true
          -o publish/osx-arm64

      - name: Make the Linux/macOS binaries executable
        run: |
          chmod +x publish/linux-x64/cbzLab.Avalonia
          chmod +x publish/osx-x64/cbzLab.Avalonia
          chmod +x publish/osx-arm64/cbzLab.Avalonia

      - name: Package Windows build
        run: |
          cd publish/win-x64
          zip -r "../../cbzLab-${{ steps.version.outputs.version }}-win-x64.zip" .

      - name: Package Linux build
        run: |
          cd publish/linux-x64
          tar -czf "../../cbzLab-${{ steps.version.outputs.version }}-linux-x64.tar.gz" .

      - name: Package macOS builds
        run: |
          cd publish/osx-x64
          tar -czf "../../cbzLab-${{ steps.version.outputs.version }}-osx-x64.tar.gz" .
          cd ../osx-arm64
          tar -czf "../../cbzLab-${{ steps.version.outputs.version }}-osx-arm64.tar.gz" .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "cbzLab-${{ steps.version.outputs.version }}-win-x64.zip" \
            "cbzLab-${{ steps.version.outputs.version }}-linux-x64.tar.gz" \
            "cbzLab-${{ steps.version.outputs.version }}-osx-x64.tar.gz" \
            "cbzLab-${{ steps.version.outputs.version }}-osx-arm64.tar.gz" \
            --title "cbzLab ${{ steps.version.outputs.version }}" \
            --generate-notes
