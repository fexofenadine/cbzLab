name: release

#triggered by pushing a version tag (e.g. `git tag v2.0.1 && git push origin v2.0.1`),
#not by every push to a branch - deliberate: a release is a cut point you choose,
#not something that should fire on every commit. Bump cbzLab.csproj's
#<Version> and MainWindow.axaml.cs's DisplayVersion together first, commit, then tag.
on:
  push:
    tags:
      - "v*.*.*"
  #dispatched by auto-tag.yml right after it pushes a new version tag - a tag
  #pushed with the default GITHUB_TOKEN doesn't trigger other workflows (GitHub's
  #built-in recursion guard), but workflow_dispatch is explicitly exempt from
  #that guard, so auto-tag.yml calls this directly with --ref <tag> instead of
  #relying on the push-tags trigger above to fire on its own for that case.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Derive version from tag (strips the leading "v")
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      #catches the tag and cbzLab.csproj's <Version> drifting apart - e.g.
      #tagging v2.1.0 while the csproj still says 2.0.0. The csproj is the only place
      #the version is written: the app reads its own at run time (DisplayVersion)
      - name: Verify tag matches the project version
        run: |
          PROJECT_VERSION=$(grep -oP '(?<=<Version>)[^<]+(?=</Version>)' cbzLab/cbzLab.csproj)
          if [ "$PROJECT_VERSION" != "${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${{ github.ref_name }} implies version ${{ steps.version.outputs.version }}, but cbzLab.csproj's <Version> is $PROJECT_VERSION - bump the csproj first."
            exit 1
          fi

      #fails the release rather than shipping a build that doesn't pass its own suite -
      #self-contained rather than relying on the separate build workflow, since a tag
      #push triggers both workflows independently with no ordering guarantee between
      #them. Each command restores for itself rather than splitting into a separate
      #restore + --no-restore/--no-build steps: a plain `dotnet restore` with no
      #-c Release doesn't know to fetch the RID-specific packages SelfContained
      #(conditional on Release) needs, and a later --no-restore build then fails.
      - name: Build and test
        run: |
          dotnet build cbzLab.sln -c Release
          dotnet test cbzLab.Tests/cbzLab.Tests.csproj -c Release

      #self-contained publish doesn't need the target OS - both run fine from this
      #ubuntu runner, and doing so here means the linux-x64 binary gets a real,
      #natively-set executable bit rather than one that has to be forced afterward
      - name: Publish win-x64
        run: >
          dotnet publish cbzLab/cbzLab.csproj
          -c Release -r win-x64 --self-contained true
          -o publish/win-x64

      - name: Publish linux-x64
        run: >
          dotnet publish cbzLab/cbzLab.csproj
          -c Release -r linux-x64 --self-contained true
          -o publish/linux-x64

      #no macOS build: nobody on this project has Apple hardware to actually
      #run/verify one, and an unsigned/unnotarized build nobody can test is
      #worse than not shipping it at all - win-x64 and linux-x64 only.
      - name: Make the Linux binary executable
        run: chmod +x publish/linux-x64/cbzLab

      #the publish folders contain just the single-file executable plus the
      #project's own cbzLab.pdb and cbzLab.Core.pdb (third-party native pdbs are already stripped
      #by cbzLab.csproj's RemoveThirdPartyNativePdbsFromPublish target) - the
      #main release download should be exactly the executable, nothing else,
      #so it's copied out on its own rather than zipped. A one-file asset
      #needs no archive at all.
      - name: Copy release executables (no debug symbols)
        run: |
          cp publish/win-x64/cbzLab.exe "cbzLab-${{ steps.version.outputs.version }}-win-x64.exe"
          cp publish/linux-x64/cbzLab "cbzLab-${{ steps.version.outputs.version }}-linux-x64"
          chmod +x "cbzLab-${{ steps.version.outputs.version }}-linux-x64"

      #a separate, optional download for anyone who actually needs to debug a
      #crash - the executable plus cbzLab.pdb and cbzLab.Core.pdb, zipped together, per platform.
      - name: Package Windows debug build (exe + pdb)
        run: |
          cd publish/win-x64
          zip -r "../../cbzLab-${{ steps.version.outputs.version }}-win-x64-debug.zip" .

      - name: Package Linux debug build (binary + pdb)
        run: |
          cd publish/linux-x64
          zip -r "../../cbzLab-${{ steps.version.outputs.version }}-linux-x64-debug.zip" .

      #for the in-app updater in installs older than 2.0.10, which only knows to look for a
      #"-win-x64.zip" or "-linux-x64.tar.gz" asset and expects the executable at the archive's
      #root. Executable only, no pdb - same contents as the bare download, just wrapped. Newer
      #installs prefer the bare executable and only fall back to these.
      - name: Package updater archives for older installs
        run: |
          zip -j "cbzLab-${{ steps.version.outputs.version }}-win-x64.zip" publish/win-x64/cbzLab.exe
          tar -czf "cbzLab-${{ steps.version.outputs.version }}-linux-x64.tar.gz" -C publish/linux-x64 cbzLab

      #pulls out just this version's own section (between its "### x.y.z - date"
      #heading and the next one) so the release notes carry the actual human-written
      #changelog entry, not just the auto-generated merged-PR list below. Matches on
      #a literal line prefix (index(), not a regex) so the version number's dots
      #can't be misread as regex wildcards.
      - name: Extract this version's changelog section
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          awk -v heading="### $VERSION " '
            index($0, heading) == 1 { found=1; next }
            found && /^### / { exit }
            found { print }
          ' CHANGELOG.md > changelog-notes.md
          if [ ! -s changelog-notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for $VERSION - release notes will only have the auto-generated PR list."
          fi

      #six assets is enough to make "which one do I want?" a fair question
      - name: Add a download guide to the release notes
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          {
            echo "**Downloads:** \`cbzLab-$VERSION-win-x64.exe\` for Windows, \`cbzLab-$VERSION-linux-x64\` for Linux"
            echo "(run \`chmod +x\` on it first), \`cbzLab-$VERSION-android.apk\` for Android (added by the android job a few minutes after the rest). The \`-debug.zip\` files add debug symbols for crash reports;"
            echo "the \`.zip\`/\`.tar.gz\` files are for the in-app updater in older versions."
            echo
            cat changelog-notes.md
          } > release-notes.md

      #--notes supplies the changelog section as-is; --generate-notes then appends
      #GitHub's own auto-generated merged-PR/commit summary after it (documented
      #gh behavior: "Additional release notes can be prepended to automatically
      #generated notes by using the --notes flag")
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            "cbzLab-${{ steps.version.outputs.version }}-win-x64.exe" \
            "cbzLab-${{ steps.version.outputs.version }}-linux-x64" \
            "cbzLab-${{ steps.version.outputs.version }}-win-x64-debug.zip" \
            "cbzLab-${{ steps.version.outputs.version }}-linux-x64-debug.zip" \
            "cbzLab-${{ steps.version.outputs.version }}-win-x64.zip" \
            "cbzLab-${{ steps.version.outputs.version }}-linux-x64.tar.gz" \
            --title "cbzLab ${{ steps.version.outputs.version }}" \
            --notes "$(cat release-notes.md)" \
            --generate-notes

  #the android app, built and signed on its own runner (it needs the .net android workload, the
  #android sdk and a jdk, which the desktop job doesn't) and attached to the release the job above
  #just created. it needs four repository secrets holding the release signing key - see
  #docs/ANDROID_PLAN.md, phase 8; without them the job says so and stops, rather than shipping an
  #unsigned apk nobody could install. re-run this workflow for the tag once they exist.
  android:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Check the signing key is available
        id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::warning::The android signing secrets aren't set, so no APK was built. See docs/ANDROID_PLAN.md (phase 8)."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET 10
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      #.net's android build accepts jdk 17 to 21
      - name: Set up Java 17
        if: steps.signing.outputs.available == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install the .NET Android workload
        if: steps.signing.outputs.available == 'true'
        run: dotnet workload install android

      #fetches the exact android platform and build tools the workload targets into the runner's sdk
      - name: Install the Android SDK pieces
        if: steps.signing.outputs.available == 'true'
        run: >
          dotnet build cbzLab.Android/cbzLab.Android.csproj
          -t:InstallAndroidDependencies -f net10.0-android
          -p:AndroidSdkDirectory="$ANDROID_HOME"
          -p:JavaSdkDirectory="$JAVA_HOME"
          -p:AcceptAndroidSDKLicenses=True

      - name: Build and sign the APK
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/cbzlab-release.keystore"
          dotnet publish cbzLab.Android/cbzLab.Android.csproj -c Release \
            -p:AndroidSdkDirectory="$ANDROID_HOME" -p:JavaSdkDirectory="$JAVA_HOME" \
            -p:AndroidKeyStore=true \
            -p:AndroidSigningKeyStore="$RUNNER_TEMP/cbzlab-release.keystore" \
            -p:AndroidSigningKeyAlias="$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            -o publish/android
          rm -f "$RUNNER_TEMP/cbzlab-release.keystore"
          VERSION="${GITHUB_REF_NAME#v}"
          cp publish/android/io.github.fexofenadine.cbzlab-Signed.apk "cbzLab-$VERSION-android.apk"

      - name: Attach the APK to the release
        if: steps.signing.outputs.available == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release upload "${{ github.ref_name }}" "cbzLab-$VERSION-android.apk" --clobber
